<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antipode Bore</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.116.0/Widgets/widgets.min.css" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #cesiumContainer { width: 100%; height: 100%; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.85); color: #00d4ff; padding: 15px; border-radius: 8px; border: 1px solid #00d4ff; }
        #result-card { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; background: white; padding: 30px; border-radius: 20px; text-align: center; width: 280px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .btn { background: #00d4ff; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="ui">
        <h2 style="margin:0; font-size: 22px;">ANTIPODE BORE</h2>
        <div id="status" style="color:white; font-size: 16px; margin-top: 5px;">Connecting...</div>
    </div>
    <div id="result-card">
        <h2 style="color:#333; margin:0">Bore Results</h2>
        <div id="dist-text" style="font-size: 24px; color: #00d4ff; margin: 15px 0;"></div>
        <button class="btn" onclick="location.reload()">PLAY AGAIN</button>
    </div>
    <div id="cesiumContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.116.0/Cesium.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script>
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwYTZmY2I4ZS0yYTlhLTQxODctYjZkZS1jOTA1ZmIxNDdiYjUiLCJpZCI6NDE5MzAwLCJpYXQiOjE3NzYzNzcyNTZ9.5O-hwuJtckLG6vECcevIOMRTDRnmyKPau4obEjV47go';
        const cities = [{ name: "Sarasota, USA", lat: 27.3364, lon: -82.5307 }, { name: "London, UK", lat: 51.5074, lon: -0.1278 }, { name: "Tokyo, Japan", lat: 35.6762, lon: 139.6503 }];
        
        window.onload = () => {
            if (typeof Cesium === 'undefined') { document.getElementById('status').innerText = "Load Failed"; return; }
            const viewer = new Cesium.Viewer('cesiumContainer', { baseLayerPicker: false, geocoder: false, homeButton: false, navigationHelpButton: false, sceneModePicker: false, timeline: false, animation: false, infoBox: false, selectionIndicator: false });
            const daily = cities[Math.floor(Math.random() * cities.length)];
            document.getElementById('status').innerText = "From: " + daily.name;
            const tLat = -daily.lat, tLon = daily.lon > 0 ? daily.lon - 180 : daily.lon + 180;
            viewer.entities.add({ position: Cesium.Cartesian3.fromDegrees(daily.lon, daily.lat), point: { pixelSize: 12, color: Cesium.Color.CYAN } });
            const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
            handler.setInputAction(function(click) {
                const cartesian = viewer.camera.pickEllipsoid(click.position);
                if (cartesian) {
                    const carto = Cesium.Cartographic.fromCartesian(cartesian);
                    viewer.entities.add({ position: Cesium.Cartesian3.fromDegrees(tLon, tLat), point: { pixelSize: 18, color: Cesium.Color.RED } });
                    const dist = Math.round(turf.distance(turf.point([Cesium.Math.toDegrees(carto.longitude), Cesium.Math.toDegrees(carto.latitude)]), turf.point([tLon, tLat]), {units: 'kilometers'}));
                    viewer.camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(tLon, tLat, 6000000), duration: 2.5 });
                    setTimeout(() => { document.getElementById('result-card').style.display = 'block'; document.getElementById('dist-text').innerText = dist + " km away"; }, 3000);
                }
            }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
        };
    </script>
</body>
</html>
